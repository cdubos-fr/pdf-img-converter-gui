[tox]
requires =
    tox>=4
isolated_build = True
envlist = py312,tests,typing,precommit,docs,deps

[testenv]
usedevelop = True
passenv =
    LD_LIBRARY_PATH

[testenv:tests]
dependency_groups = dev
commands =
    pytest {posargs} \
        --cov=pdf_img_converter_gui \
        --cov-report=term-missing \
        tests/ --disable-pytest-warnings

[testenv:typing]
dependency_groups = dev
commands =
    mypy --install-types {posargs} \
        -p=pdf_img_converter_gui \
        --show-error-codes \
        --non-interactive
    mypy --install-types {posargs} tests \
        --show-error-codes \
        --non-interactive

[testenv:precommit]
deps =
    pre-commit
commands =
    pre-commit run --all-files

[testenv:docs]
dependency_groups =
    docs
commands =
    mkdocs build

[testenv:deps]
deps =
    pdm
commands =
    pdm lock --check

[testenv:devenv]
basepython = py312
dependency_groups =
    dev
groups =
    typing
    tests
    docs
