name: CI -> Check tests and build
on:
  push:
    branches:
    - main
    tags:
    - "*.*.*"
  pull_request:
    branches:
    - main

jobs:
  code-quality:
    name: Check tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install PDM
      run: |
        pip install pdm

    - name: Install dependencies
      run: |
        pdm install -G :all

    - name: Run test suite
      run: pdm run tox

  check-build:
    name: Check build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install PDM
      run: |
        pip install pdm

    - name: Install dependencies
      run: |
        pdm install -G :all

    - name: Check build
      run: pdm build
